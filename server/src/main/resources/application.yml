server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB
  application:
    name: lexiflow-server

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  data:
    redis:
      host: ${LEXIFLOW_REDIS_HOST:localhost}
      port: ${LEXIFLOW_REDIS_PORT:6379}
      password: ${LEXIFLOW_REDIS_PASSWORD:}
      timeout: 2s

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lexiflow_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis-Plus Configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

# SpringDoc OpenAPI 3 / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# LexiFlow Custom Config
lexiflow:
  jwt:
    # 256-bit+ secure base64 secret for HMAC-SHA256
    secret: TGV4aUZsb3dNdWx0aU1vZGFsQ29nbml0aXZlU3BhY2VkUmVwZXRpdGlvbkp3dFNlY3JldEtleTIwMjY=
    expiration: 604800000 # 7 days (ms)
  fsrs:
    request-retention: 0.90
    maximum-interval: 36500
  storage:
    type: ${LEXIFLOW_STORAGE_TYPE:local}
    local:
      root: ${LEXIFLOW_STORAGE_ROOT:./storage}
    minio:
      endpoint: ${LEXIFLOW_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${LEXIFLOW_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${LEXIFLOW_MINIO_SECRET_KEY:minioadmin}
      bucket: ${LEXIFLOW_MINIO_BUCKET:lexiflow-media}
  async-job:
    worker-token: ${LEXIFLOW_MEDIA_WORKER_TOKEN:change-me-in-production}
    claim-batch-size: 4
    poll-interval-ms: 5000
    reclaim-interval-ms: 30000
    lock-timeout-seconds: 600
    base-retry-seconds: 5
    max-retry-seconds: 300
    sse-timeout-ms: 1800000
  media:
    upload-part-size: 8388608
    max-file-size: 4294967296
    user-storage-quota: 21474836480
    upload-expiration-hours: 24
    max-duration-seconds: 14400
    max-subtitle-size: 10485760
    max-subtitle-cues: 20000
    upload-cleanup-interval-ms: 3600000
    deleted-retention-hours: 24
    deleted-cleanup-interval-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
